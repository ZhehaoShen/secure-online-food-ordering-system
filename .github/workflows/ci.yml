name: Cross-platform CI

"on":
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: brew install postgresql@16

      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/config/database.js
          node --check src/controllers/menu-controller.js
          node --check src/db/pool.js
          node --check src/errors.js
          node --check src/logger.js
          node --check src/repositories/food-item-repository.js
          node --check src/routes/menu-routes.js
          node --check src/runtime-state.js
          node --check src/server.js
          node --check src/services/menu-service.js
          node --check scripts/database-task.js
          node --check scripts/healthcheck.js
          node --check scripts/shutdown.js
          node --check tests/helpers/postgres-test-server.js
          node --check tests/integration/database-menu-foundation.test.js
          node --check vitest.config.js

      - name: Run tests
        run: npm test
